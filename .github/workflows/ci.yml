name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Statistics and tables regenerate from the mission records
        run: |
          python scripts/analysis/analyze_mc.py > /dev/null
          python scripts/analysis/make_tables.py
          git diff --stat --exit-code results/statistics paper/tables
