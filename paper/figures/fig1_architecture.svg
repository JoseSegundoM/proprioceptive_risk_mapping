   <g id="text_1">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(3.772378 10.029648)">Dynamic simulation (MuJoCo)</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(4.608722 17.029979)">fixed legged or wheeled robot,</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(8.188706 23.949873)">parametrised terrain contact</text>
   </g>
   <g id="text_2">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(9.548409 40.468481)">Proprioception: IMU, joint</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(16.729519 47.369813)">position and velocity,</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(19.636097 54.289706)">commanded torque</text>
   </g>
   <g id="text_3">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(3.597066 69.996263)">Exteroception (assumed input):</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(16.914628 76.897594)">geometry, roughness,</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(18.913191 83.897925)">appearance features</text>
   </g>
   <g id="text_4">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(115.906913 40.477763)">Terrain classifier</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(115.395413 47.379094)">window features,</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(119.702944 54.280425)">random forest</text>
   </g>
   <g id="text_5">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(112.551741 10.088429)">Held-out confusion</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(113.652084 16.98976)">observation model</text>
    <!-- $p(o\mid t,b)$ -->
    <g transform="translate(126.9021 23.891092)">
     <text>
      <tspan style="font: italic 6.6px 'STIXGeneral'" x="0 5.518967 12.474057 16.907687" y="-0.453125">potb</tspan>
      <tspan style="font: 6.6px 'STIXGeneral'" x="3.323257 9.767981 14.307111 20.204562" y="-0.453125">(∣,)</tspan>
     </text>
    </g>
   </g>
   <g id="text_6">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(218.665322 29.98005)">Risk map</text>
    <!-- belief $b_i(t)$ per cell -->
    <g transform="translate(206.7054 37.008844)">
     <text>
      <tspan style="font: 6.6px 'Liberation Serif'" x="0 3.296875 6.223495 8.05545 9.887405 12.814026 15.009796 27.753343 29.401781 32.698656 35.625276 37.821046 39.469484 42.396104 45.322725 47.15468" y="-0.359375">belief  per cell</tspan>
      <tspan style="font: italic 6.6px 'STIXGeneral'" x="16.658234 23.72458" y="-0.359375">bt</tspan>
      <tspan style="font: italic 4.62px 'STIXGeneral'" x="19.955109" y="0.5125000000000002">i</tspan>
      <tspan style="font: 6.6px 'STIXGeneral'" x="21.528871 25.557634" y="-0.359375">()</tspan>
     </text>
    </g>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(206.113462 43.956581)">M0 geometry prior</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(210.511228 50.876475)">M1 local Bayes</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(204.470166 57.796369)">M2 appearance vote</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(204.462947 64.778137)">M3 tempered fusion</text>
   </g>
   <g id="text_7">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(306.68805 27.084105)">Risk-aware A*, replanning</text>
    <!-- cost rate: $1+\lambda\,\bar h_i$ -->
    <g transform="translate(320.0448 34.820749)">
     <text>
      <tspan style="font: 6.6px 'Liberation Serif'" x="0 2.92662 6.223495 8.78952 10.621475 12.269913 14.465683 17.392303 19.224258 22.150879 23.982834" y="-0.3156249999999998">cost rate: </tspan>
      <tspan style="font: 6.6px 'STIXGeneral'" x="25.631271 29.880286 42.463338" y="-0.3156249999999998 -0.3156249999999998 -2.03125">1+̄</tspan>
      <tspan style="font: italic 6.6px 'STIXGeneral'" x="35.349149 39.162557" y="-0.3156249999999998">λh</tspan>
      <tspan style="font: italic 4.62px 'STIXGeneral'" x="42.561151" y="0.5562500000000004">i</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(313.371066 56.904429)">Monte Carlo mission:</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(301.293066 63.80576)">true hazard accumulates, never</text>
    <text style="font: 6.6px 'Liberation Serif', 'DejaVu Serif', serif" transform="translate(313.098816 70.707092)">visible to the methods</text>
   </g>
